<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="LOGO — placeholder">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3A414B" stroke-width="1"/>
    </pattern>
    <pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#E4570F"/>
      <rect x="12" width="12" height="24" fill="#F5B301"/>
    </pattern>
  </defs>
  <rect width="480" height="120" fill="#242930"/>
  <rect width="480" height="120" fill="url(#grid)" opacity=".35"/>
  <rect x="0" y="0" width="480" height="14" fill="url(#hazard)" opacity=".9"/>
  <rect x="0" y="106" width="480" height="14" fill="url(#hazard)" opacity=".9"/>
  <g fill="#E8EAED" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="240" y="55.6" font-size="11" font-weight="700" letter-spacing="2">LOGO</text>
    <text x="240" y="69.9" font-size="9" fill="#9AA3AE" letter-spacing="3">480×120 — TỈ LỆ 4:1</text>
    <text x="240" y="88.8" font-size="6" fill="#E4570F">Thay bằng logo công ty (SVG ưu tiên), 480×120</text>
  </g>
</svg>
